version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: jdraid-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: jdraid
    volumes:
      - mongodb_data:/data/db
    networks:
      - jdraid-network

  api:
    build: .
    container_name: jdraid-api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/jdraid
      JWT_SECRET: jdraid_secret_key
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./:/app
    networks:
      - jdraid-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  jdraid-network:
    driver: bridge
